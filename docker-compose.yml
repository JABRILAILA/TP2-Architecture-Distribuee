services:
  etudiants:
    build: ./ServiceEtudiants
    ports:
      - "8081:8081"
  cours:
      build: ./ServiceCours
      ports:
        - "8082:8082"
      environment:
        - ETUDIANTS_URL=http://etudiants:8081
        - SERVICE_ETUDIANTS_URL=http://etudiants:8081
      depends_on:
        - etudiants